# ==========================================
# SERVER
# ==========================================
server.port=8081


# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/frndschat
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Since you are using Flyway for database tables
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true


# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=postgres
spring.flyway.password=postgres


# ==========================================
# MAIL / GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:default-very-secret-key-change-in-production}
jwt.expiration=86400000


# ==========================================
# CORS
# ==========================================
cors.origin=http://localhost:5173


# ==========================================
# RATE LIMITING
# ==========================================
bucket4j.default-period=60
bucket4j.default-maximum=10